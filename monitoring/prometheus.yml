# ==============================================================================
# Prometheus Core Configuration
# ==============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  # Self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Host Infrastructure Telemetry
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    relabel_configs:
      - target_label: instance
        replacement: 'azure-linux-vm'

  # Application Runtime Metrics & Probes
  - job_name: 'fastapi-app'
    metrics_path: '/healthz'
    scrape_interval: 10s
    static_configs:
      - targets: ['api:8000']
    relabel_configs:
      - target_label: service
        replacement: 'cloudapp-api'
