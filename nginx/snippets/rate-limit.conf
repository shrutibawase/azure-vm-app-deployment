# Rate Limiting Configuration & DDoS Mitigation
# 10MB zone tracks ~160,000 unique IP addresses

# General API rate limit: 10 requests/second per IP
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# Strict rate limit for authentication & mutation endpoints: 2 requests/second
limit_req_zone $binary_remote_addr zone=strict_limit:10m rate=2r/s;

# Return HTTP 429 Too Many Requests when threshold exceeded
limit_req_status 429;
