#cloud-config

package_update: true
package_upgrade: true

packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg
  - lsb-release
  - git
  - htop
  - jq
  - unzip
  - ufw
  - fail2ban

write_files:
  - path: /etc/fail2ban/jail.local
    owner: root:root
    permissions: '0644'
    content: |
      [DEFAULT]
      bantime = 1h
      findtime = 10m
      maxretry = 5

      [sshd]
      enabled = true
      port = 22
      logpath = %(sshd_log)s
      backend = %(default_backend)s

runcmd:
  # 1. Configure Host Firewall (UFW)
  - ufw --force reset
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp comment 'SSH Remote Management'
  - ufw allow 80/tcp comment 'HTTP Ingress'
  - ufw allow 443/tcp comment 'HTTPS Ingress'
  - ufw --force enable

  # 2. Install Docker Engine & Docker Compose Plugin
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
  - apt-get update -y
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

  # 3. Configure Docker service & permissions
  - systemctl enable docker
  - systemctl start docker
  - usermod -aG docker ${admin_username}

  # 4. Enable and start Fail2Ban
  - systemctl enable fail2ban
  - systemctl restart fail2ban

  # 5. Signal provisioning completion
  - echo "Cloud-init VM bootstrap completed at $(date)" > /var/log/cloud-init-bootstrap-complete.log
